name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [16, 18, 20]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: |
          echo "Checking JavaScript syntax..."
          find assets/js -name "*.js" -exec node -c {} \;
          echo "All JavaScript files have valid syntax"

      - name: Validate HTML
        run: |
          echo "Validating HTML files..."
          # Basic HTML validation - check for common issues
          if grep -r "<!DOCTYPE html>" *.html; then
            echo "HTML files have DOCTYPE declaration"
          else
            echo "Warning: Some HTML files may be missing DOCTYPE"
          fi

      - name: Check for security issues
        run: |
          echo "Checking for potential security issues..."
          # Check for common security anti-patterns
          if grep -r "eval(" assets/js/ || grep -r "innerHTML.*=" assets/js/; then
            echo "Warning: Potential security issues found"
            exit 1
          else
            echo "No obvious security issues found"
          fi